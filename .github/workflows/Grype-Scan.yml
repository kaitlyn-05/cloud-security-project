
name: Grype Security Scan

on:
  push:
  pull_request:

jobs:
  grype-scan:
    name: Scan Docker Image with Grype
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t study-room-test:latest .

      - name: Scan image and generate SARIF
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: study-room-test:latest
          fail-build: false
          output-format: sarif
          output-file: results.sarif

      - name: Upload Grype scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

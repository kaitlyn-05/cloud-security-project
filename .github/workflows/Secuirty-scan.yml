name: Trivy Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t study-room-test:latest .

      # Generate SARIF for GitHub Security
      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: study-room-test:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Generate JSON for Python risk analysis
      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: study-room-test:latest
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-json-results
          path: trivy-results.json
          if-no-files-found: error

      - name: Save Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: trivy-results.sarif
          if-no-files-found: ignore
